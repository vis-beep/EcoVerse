<rect width="1200" height="330" rx="20" fill="#f0fdf4"/><text x="600" y="42" font-size="26" font-weight="800" fill="#064e3b" text-anchor="middle">How an issue gets resolved</text><rect x="45" y="75" width="190" height="190" rx="16" fill="#fff" stroke="#10b981" stroke-width="2.5"/><circle cx="140.0" cy="75" r="22" fill="#10b981"/><text x="140.0" y="83" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="140.0" y="132" font-size="24" font-weight="800" fill="#0f172a" text-anchor="middle">Report</text><text x="140.0" y="168" font-size="15" fill="#475569" text-anchor="middle">Student uploads a</text><text x="140.0" y="192" font-size="15" fill="#475569" text-anchor="middle">photo of the issue</text><path d="M241 170 L269 170" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/><path d="M261 162 L271 170 L261 178" stroke="#94a3b8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="275" y="75" width="190" height="190" rx="16" fill="#fff" stroke="#0ea5e9" stroke-width="2.5"/><circle cx="370.0" cy="75" r="22" fill="#0ea5e9"/><text x="370.0" y="83" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="370.0" y="132" font-size="24" font-weight="800" fill="#0f172a" text-anchor="middle">AI Triage</text><text x="370.0" y="168" font-size="15" fill="#475569" text-anchor="middle">Issue is classified</text><text x="370.0" y="192" font-size="15" fill="#475569" text-anchor="middle">and routed to the</text><text x="370.0" y="216" font-size="15" fill="#475569" text-anchor="middle">right department</text><path d="M471 170 L499 170" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/><path d="M491 162 L501 170 L491 178" stroke="#94a3b8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="505" y="75" width="190" height="190" rx="16" fill="#fff" stroke="#f59e0b" stroke-width="2.5"/><circle cx="600.0" cy="75" r="22" fill="#f59e0b"/><text x="600.0" y="83" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="600.0" y="132" font-size="24" font-weight="800" fill="#0f172a" text-anchor="middle">Fix</text><text x="600.0" y="168" font-size="15" fill="#475569" text-anchor="middle">Technician</text><text x="600.0" y="192" font-size="15" fill="#475569" text-anchor="middle">acknowledges, starts</text><text x="600.0" y="216" font-size="15" fill="#475569" text-anchor="middle">and finishes work</text><path d="M701 170 L729 170" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/><path d="M721 162 L731 170 L721 178" stroke="#94a3b8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="735" y="75" width="190" height="190" rx="16" fill="#fff" stroke="#8b5cf6" stroke-width="2.5"/><circle cx="830.0" cy="75" r="22" fill="#8b5cf6"/><text x="830.0" y="83" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="830.0" y="132" font-size="24" font-weight="800" fill="#0f172a" text-anchor="middle">Proof</text><text x="830.0" y="168" font-size="15" fill="#475569" text-anchor="middle">Technician uploads a</text><text x="830.0" y="192" font-size="15" fill="#475569" text-anchor="middle">repair photo</text><path d="M931 170 L959 170" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/><path d="M951 162 L961 170 L951 178" stroke="#94a3b8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="965" y="75" width="190" height="190" rx="16" fill="#fff" stroke="#ef4444" stroke-width="2.5"/><circle cx="1060.0" cy="75" r="22" fill="#ef4444"/><text x="1060.0" y="83" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">5</text><text x="1060.0" y="132" font-size="24" font-weight="800" fill="#0f172a" text-anchor="middle">Verify</text><text x="1060.0" y="168" font-size="15" fill="#475569" text-anchor="middle">Admin approves, or</text><text x="1060.0" y="192" font-size="15" fill="#475569" text-anchor="middle">sends it back for</text><text x="1060.0" y="216" font-size="15" fill="#475569" text-anchor="middle">rework</text><path d="M1060 265 L1060 298 L600 298 L600 272" stroke="#ef4444" stroke-width="2.5" fill="none" stroke-dasharray="7 6" stroke-linecap="round"/><path d="M592 282 L600 270 L608 282" stroke="#ef4444" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="720" y="286" width="250" height="24" rx="12" fill="#f0fdf4"/><text x="845" y="303" font-size="14" font-weight="600" fill="#ef4444" text-anchor="middle">Rework needed: back to step 3</text>
